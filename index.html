<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Family Prayer Book</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>My Family Prayer Book</h1>
    <p>Choose a prayer or read a story</p>
  </header>

  <main>

    <section class="prayers-section">
      <h2>Prayers</h2>

      <label for="prayerSelect">
        Choose a prayer:
      </label>

      <select id="prayerSelect">
        <option value="all">All Prayers</option>
      </select>

      <label for="categorySelect">
        Choose a category:
      </label>

      <select id="categorySelect">
        <option value="all">All Categories</option>
      </select>

      <label for="subcategorySelect">
        Choose a subcategory:
      </label>

      <select id="subcategorySelect">
        <option value="all">All Subcategories</option>
      </select>

      <input
        type="text"
        id="searchInput"
        placeholder="Search for a prayer..."
      >

      <section id="prayerList"></section>
    </section>


    <section class="stories-section">
      <h2>Stories</h2>

      <label for="storySelect">
        Choose a story:
      </label>

      <select id="storySelect">
        <option value="all">All Stories</option>
      </select>

      <section id="storyList"></section>
    </section>

  </main>

  <footer>
    <p>My Family Prayer Book</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>

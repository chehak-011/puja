<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Daily Pujas</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>My Daily Pujas</h1>

    <input

      id="searchInput"

    <section id="prayerList"></section>

  </main>

  <footer>
    <p>My Family Prayer Book</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>

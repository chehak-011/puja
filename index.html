<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Family Prayer Book</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>My Family Prayer Book</h1>
    <p>Choose a language and select a prayer</p>
  </header>

  <main>

    <label for="languageSelect">Choose language:</label>

    <select id="languageSelect">
      <option value="hindi">हिंदी</option>
      <option value="hinglish">Hinglish</option>
      <option value="english">English</option>
    </select>

    <label for="prayerSelect">Choose a prayer:</label>

    <select id="prayerSelect">
      <option value="all">All Prayers</option>
    </select>

    <label for="categorySelect">Choose a category:</label>

    <select id="categorySelect">
      <option value="all">All Categories</option>
    </select>

    <input
      type="text"
      id="searchInput"
      placeholder="Search for a prayer..."
    >

    <section id="prayerList"></section>

  </main>

  <footer>
    <p>My Family Prayer Book</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
